name: Tabline extension
on:
  push:
    branches: [macos-companion]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - name: Package Chrome-only Mac extension
        shell: pwsh
        run: Compress-Archive -LiteralPath manifest.json,background.js,native-bridge.js,browser-capture.js,rope-ui.js,clipboard.html,clipboard.css,clipboard.js,picker.html,picker.css,picker.js,settings.html,settings.js,settings.css -DestinationPath Tabline-extension.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tabline-Chrome-extension
          path: Tabline-extension.zip
